# LOCAL ONLY. Throwaway Postgres with a dummy password. Never used in dev/qa/prod (they use RDS).
apiVersion: v1
kind: Secret
metadata: {name: conductor-db}
stringData: {url: "postgresql://postgres:local-only@postgres:5432/conductor"}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env: [{name: POSTGRES_PASSWORD, value: local-only}, {name: POSTGRES_DB, value: conductor}]
          ports: [{containerPort: 5432}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres}
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
