apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-sa
  {{- if .Values.serviceAccounts.agentRoleArn }}
  annotations: {eks.amazonaws.com/role-arn: {{ .Values.serviceAccounts.agentRoleArn | quote }}}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dispatcher-sa
  {{- if .Values.serviceAccounts.dispatcherRoleArn }}
  annotations: {eks.amazonaws.com/role-arn: {{ .Values.serviceAccounts.dispatcherRoleArn | quote }}}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: dispatcher-jobs}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: dispatcher-jobs}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: dispatcher-jobs}
subjects: [{kind: ServiceAccount, name: dispatcher-sa}]
