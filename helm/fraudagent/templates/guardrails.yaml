apiVersion: v1
kind: ResourceQuota
metadata: {name: fraudagent-quota}
spec:
  hard:
    requests.cpu: {{ .Values.quota.cpu | quote }}
    requests.memory: {{ .Values.quota.memory }}
    pods: {{ .Values.quota.pods | quote }}
---
apiVersion: v1
kind: LimitRange
metadata: {name: fraudagent-limits}
spec:
  limits:
    - type: Container
      default: {cpu: "1", memory: 2Gi}
      defaultRequest: {cpu: 250m, memory: 512Mi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-egress-db-dns-https}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - ports: [{port: 5432}]
    - ports: [{port: 443}]   # tighten to VPC endpoint CIDRs per env
