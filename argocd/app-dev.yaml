apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: fraudagent-dev, namespace: argocd}
spec:
  project: fraudagent
  source:
    repoURL: https://github.com/hcmarella/eks-aws.git
    targetRevision: main
    path: helm/fraudagent
    helm: {valueFiles: [values.yaml, values-dev.yaml]}
  destination: {server: https://kubernetes.default.svc, namespace: fraudagent-dev}
  syncPolicy: {automated: {prune: true, selfHeal: true}, syncOptions: [CreateNamespace=true]}
